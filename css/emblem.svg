<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="emblemTitle">
<title id="emblemTitle">Winged sword inside an engraved bezel ring</title>
<defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#d9bb62"/>
<stop offset="55%" stop-color="#a8832a"/>
<stop offset="100%" stop-color="#5a4214"/>
</linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#6c727b"/>
<stop offset="50%" stop-color="#d6dadf"/>
<stop offset="100%" stop-color="#5d636c"/>
</linearGradient>
<radialGradient id="disc" cx="50%" cy="50%" r="60%">
<stop offset="0%" stop-color="#1c1409"/>
<stop offset="100%" stop-color="#070605"/>
</radialGradient>
<g id="ticks">
<line x1="100" y1="5" x2="100" y2="11" stroke="#a8832a" stroke-width="1.4"/>
<line x1="100" y1="189" x2="100" y2="195" stroke="#a8832a" stroke-width="1.4"/>
</g>
<g id="ray">
<line x1="100" y1="22" x2="100" y2="178" stroke="#a8832a" stroke-width="0.6" opacity="0.35"/>
</g>
<g id="wing">
<g transform="rotate(-52)"><path d="M0 0 L7 -6 L44 0 L7 6 Z" fill="url(#gold)" stroke="#2c200a" stroke-width="0.9" stroke-linejoin="round"/><line x1="6" y1="0" x2="40" y2="0" stroke="#2c200a" stroke-width="0.7"/></g>
<g transform="rotate(-36)"><path d="M0 0 L8 -7 L58 0 L8 7 Z" fill="url(#gold)" stroke="#2c200a" stroke-width="0.9" stroke-linejoin="round"/><line x1="6" y1="0" x2="54" y2="0" stroke="#2c200a" stroke-width="0.7"/></g>
<g transform="rotate(-20)"><path d="M0 0 L8 -7 L66 0 L8 7 Z" fill="url(#gold)" stroke="#2c200a" stroke-width="0.9" stroke-linejoin="round"/><line x1="6" y1="0" x2="62" y2="0" stroke="#2c200a" stroke-width="0.7"/></g>
<g transform="rotate(-5)"><path d="M0 0 L8 -7 L64 0 L8 7 Z" fill="url(#gold)" stroke="#2c200a" stroke-width="0.9" stroke-linejoin="round"/><line x1="6" y1="0" x2="60" y2="0" stroke="#2c200a" stroke-width="0.7"/></g>
<g transform="rotate(10)"><path d="M0 0 L7 -6 L54 0 L7 6 Z" fill="url(#gold)" stroke="#2c200a" stroke-width="0.9" stroke-linejoin="round"/><line x1="6" y1="0" x2="50" y2="0" stroke="#2c200a" stroke-width="0.7"/></g>
<g transform="rotate(24)"><path d="M0 0 L6 -5 L40 0 L6 5 Z" fill="url(#gold)" stroke="#2c200a" stroke-width="0.9" stroke-linejoin="round"/><line x1="5" y1="0" x2="36" y2="0" stroke="#2c200a" stroke-width="0.7"/></g>
</g>
</defs>

<circle cx="100" cy="100" r="97" fill="url(#disc)"/>
<use href="#ticks"/>
<use href="#ticks" transform="rotate(15 100 100)"/>
<use href="#ticks" transform="rotate(30 100 100)"/>
<use href="#ticks" transform="rotate(45 100 100)"/>
<use href="#ticks" transform="rotate(60 100 100)"/>
<use href="#ticks" transform="rotate(75 100 100)"/>
<use href="#ticks" transform="rotate(90 100 100)"/>
<use href="#ticks" transform="rotate(105 100 100)"/>
<use href="#ticks" transform="rotate(120 100 100)"/>
<use href="#ticks" transform="rotate(135 100 100)"/>
<use href="#ticks" transform="rotate(150 100 100)"/>
<use href="#ticks" transform="rotate(165 100 100)"/>
<circle cx="100" cy="100" r="97" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
<circle cx="100" cy="100" r="90" fill="none" stroke="#6b5330" stroke-width="1"/>
<circle cx="100" cy="100" r="80" fill="none" stroke="#8a1c14" stroke-width="1.4"/>

<use href="#ray"/>
<use href="#ray" transform="rotate(30 100 100)"/>
<use href="#ray" transform="rotate(60 100 100)"/>
<use href="#ray" transform="rotate(90 100 100)"/>
<use href="#ray" transform="rotate(120 100 100)"/>
<use href="#ray" transform="rotate(150 100 100)"/>

<use href="#wing" transform="translate(110 94)"/>
<use href="#wing" transform="translate(90 94) scale(-1 1)"/>

<polygon points="100,20 105,34 105,112 95,112 95,34" fill="url(#steel)" stroke="#2a2d32" stroke-width="1"/>
<line x1="100" y1="32" x2="100" y2="110" stroke="#4a5058" stroke-width="1.6"/>
<path d="M74 112 L126 112 L122 120 L108 121 L100 125 L92 121 L78 120 Z" fill="url(#gold)" stroke="#2c200a" stroke-width="1" stroke-linejoin="round"/>
<path d="M74 112 L70 108 L76 111 Z M126 112 L130 108 L124 111 Z" fill="#a8832a"/>
<rect x="96.5" y="121" width="7" height="30" fill="#2a0e0b" stroke="#120504" stroke-width="1"/>
<line x1="96.5" y1="129" x2="103.5" y2="129" stroke="#a8832a" stroke-width="1"/>
<line x1="96.5" y1="137" x2="103.5" y2="137" stroke="#a8832a" stroke-width="1"/>
<line x1="96.5" y1="145" x2="103.5" y2="145" stroke="#a8832a" stroke-width="1"/>
<polygon points="100,151 106,158 100,168 94,158" fill="url(#gold)" stroke="#2c200a" stroke-width="1" stroke-linejoin="round"/>
</svg>
